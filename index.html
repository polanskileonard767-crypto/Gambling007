<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAMBLING 007 — Arcade Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-grid"></div>
<header class="topbar">
  <div class="brand"><span>007</span><div><b>GAMBLING 007</b><small>ARCADE DEMO</small></div></div>
  <div class="score"><small>VIRTUAL SCORE</small><strong id="score">10.000</strong></div>
  <button id="reset" class="reset">RESET</button>
</header>
<main>
  <section class="hero">
    <div>
      <div class="eyebrow">◆ 007 ARCADE</div>
      <h1>WÄHLE EIN<br><span>SPIEL.</span></h1>
      <p>Ein Klick. Ein Spiel. Fertig. Alles läuft nur mit virtuellen Punkten — kein echtes Geld.</p>
    </div>
    <div class="hero-card"><b>007</b><span>READY TO PLAY</span><i>● SYSTEM ONLINE</i></div>
  </section>

  <section class="games">
    <div class="section-head"><div><small>SPIELE</small><h2>PLAY NOW</h2></div><span>4 MINI-GAMES</span></div>
    <div class="game-grid">
      <button class="game-card" data-game="slots"><div class="art slots-art"><div class="slots"><i>0</i><i>0</i><i>7</i></div></div><b>SLOT 007</b><small>3 Zahlen · 007 treffen</small><strong>SPIELEN →</strong></button>
      <button class="game-card" data-game="dice"><div class="art dice-art"><div class="dice">?</div></div><b>DICE</b><small>Eine Zahl würfeln</small><strong>SPIELEN →</strong></button>
      <button class="game-card" data-game="mines"><div class="art mines-art"><div class="mini-grid">${Array(9).fill('<i></i>').join('')}</div></div><b>MINES</b><small>Finde das Ziel</small><strong>SPIELEN →</strong></button>
      <button class="game-card" data-game="target"><div class="art target-art"><div class="target">+</div></div><b>TARGET</b><small>Klicke den Punkt</small><strong>SPIELEN →</strong></button>
    </div>
  </section>
</main>
<div id="modal" class="modal hidden"><div class="modal-box"><button id="close" class="close">×</button><div id="game"></div></div></div>
<script src="app.js"></script>
</body>
</html>
